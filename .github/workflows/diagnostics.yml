name: Diagnostics

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  diagnostics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test -- --runInBand

      - name: Run diagnostics
        run: npm run diagnostics

      - name: Run launch-critical diagnostics
        run: |
          npm run diagnostics:ss-bowling-strike
          npm run diagnostics:domino-spinner
          npm run diagnostics:chase-the-bag-deploy
          npm run diagnostics:creator-application-gate
          npm run diagnostics:command-center
          npm run diagnostics:reward-supply
