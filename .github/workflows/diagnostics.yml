name: Diagnostics

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  diagnostics:
    # Playwright 1.56.1 supports this image; do not follow rolling OS upgrades.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test -- --runInBand

      - name: Check Creator community database permissions and publishing
        run: node scripts/check-creator-member-db.js

      - name: Check global friends phone and desktop layouts
        run: |
          npm install --prefix /tmp/hw-social-browser --no-save playwright@1.56.1
          /tmp/hw-social-browser/node_modules/.bin/playwright install --with-deps chromium --only-shell
          NODE_PATH=/tmp/hw-social-browser/node_modules node scripts/check-global-social-browser.js

      - name: Upload global friends layout previews
        uses: actions/upload-artifact@v7
        with:
          name: global-friends-layouts
          path: /tmp/global-social-*.png
          if-no-files-found: error

      - name: Check approved Street Empire entry on phones and desktop
        run: NODE_PATH=/tmp/hw-social-browser/node_modules node scripts/check-street-entry-browser.js

      - name: Check Chase the Bag controls stay outside the maze
        run: NODE_PATH=/tmp/hw-social-browser/node_modules node scripts/check-cash-run-controls-browser.js

      - name: Check Chase the Bag artist soundtrack and real MP3 playback
        run: NODE_PATH=/tmp/hw-social-browser/node_modules node scripts/check-cash-run-soundtrack-browser.js

      - name: Upload Street Empire entry previews
        uses: actions/upload-artifact@v7
        with:
          name: street-empire-entry-layouts
          path: /tmp/street-entry-*.png
          if-no-files-found: error

      - name: Check Creator World urban culture layouts
        run: NODE_PATH=/tmp/hw-social-browser/node_modules node scripts/check-creator-skate-browser.js

      - name: Check Creator community uploads on phones and desktop
        run: NODE_PATH=/tmp/hw-social-browser/node_modules node scripts/check-creator-member-browser.js

      - name: Upload Creator community previews
        uses: actions/upload-artifact@v7
        with:
          name: creator-community-layouts
          path: /tmp/creator-member-*.png
          if-no-files-found: error

      - name: Upload Creator World layout previews
        uses: actions/upload-artifact@v7
        with:
          name: creator-urban-culture-layouts
          path: /tmp/creator-skate-*.png
          if-no-files-found: error

      - name: Check page loading and native navigation
        run: node --test scripts/check-page-loading.js

      - name: Verify casino table animations are visual-only
        run: node scripts/check-casino-motion.js

      - name: Run diagnostics
        run: npm run diagnostics:full

      - name: Run launch-critical diagnostics
        run: |
          npm run diagnostics:ss-bowling-strike
          npm run diagnostics:domino-spinner
          npm run diagnostics:chase-the-bag-deploy
          npm run diagnostics:creator-application-gate
          npm run diagnostics:command-center
          npm run diagnostics:reward-supply
