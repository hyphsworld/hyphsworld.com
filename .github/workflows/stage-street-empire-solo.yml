name: Stage Street Empire online web

on:
  pull_request:
    paths:
      - '.github/workflows/stage-street-empire-solo.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-street-empire-solo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-street-empire-solo
  cancel-in-progress: false

jobs:
  verify-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require private source access
        env:
          SOURCE_TOKEN: ${{ secrets.STREET_EMPIRE_READ_TOKEN }}
        run: |
          if test -z "$SOURCE_TOKEN"; then
            echo "::error::Add a fine-grained read-only token for hyphsworld/STREET-EMPIRE as STREET_EMPIRE_READ_TOKEN in this repository."
            exit 1
          fi
      - name: Verify token can read the private repository
        env:
          SOURCE_TOKEN: ${{ secrets.STREET_EMPIRE_READ_TOKEN }}
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $SOURCE_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/hyphsworld/STREET-EMPIRE)"
          if test "$status" != 200; then
            echo "::error::STREET_EMPIRE_READ_TOKEN cannot read hyphsworld/STREET-EMPIRE (GitHub API HTTP $status). Check the token's repository selection, Contents: Read permission, and approval/expiration."
            exit 1
          fi
      - name: Checkout pinned Street Empire source
        uses: actions/checkout@v4
        with:
          repository: hyphsworld/STREET-EMPIRE
          ref: 5abad23bf4fdc51a2c5c079522c5f7da09806579
          token: ${{ secrets.STREET_EMPIRE_READ_TOKEN }}
          path: game
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check board data
        run: python3 game/scripts/export_game_config.py --check
      - name: Install dependencies and typecheck
        working-directory: game/frontend
        run: |
          corepack enable
          yarn install --non-interactive
          yarn tsc --noEmit
          node scripts/check-solo-upgrade.js
          node scripts/check-solo-persistence.js
          node scripts/check-audio-races.js
          node scripts/check-web-audio.js
          node scripts/check-roll-cues.js
      - name: Export web build
        working-directory: game/frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: ''
          CI: '1'
        run: yarn export:web
      - name: Add static deep links
        run: python3 game/scripts/prepare_pages_export.py
      - name: Verify routes and local assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('game/frontend/dist')
          for path in ('index.html', 'setup.html', 'game.html', 'online.html', 'login.html',
                       'online-game.html', 'setup/index.html', 'game/index.html',
                       'online/index.html', 'login/index.html', 'online-game/index.html'):
              assert (root / path).is_file(), path
          html_files = list(root.rglob('*.html'))
          assert html_files
          for page in html_files:
              text = page.read_text(encoding='utf-8')
              for ref in re.findall(r'(?:src|href)="([^"]+)"', text):
                  if ref.startswith('/games/street-empire/'):
                      asset = ref.removeprefix('/games/street-empire/')
                      assert (root / asset).is_file(), (page, ref)
          print(f'Checked {len(html_files)} HTML routes and local assets')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: street-empire-online-site
          path: game/frontend/dist/
          if-no-files-found: error

  publish-route:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: verify-export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout HYPHSWORLD main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: street-empire-online-site
          path: site/street-empire-export
      - name: Publish verified route update
        working-directory: site
        run: |
          test -s street-empire-export/index.html
          test -s games/street-empire/index.html
          previous_source="$(git show HEAD:games/street-empire/.source-sha)"
          if test "$previous_source" != 'ead26e317b52ee2c930232879eebaae39d95a82c'; then
            echo "::error::Street Empire route changed since the reviewed export; inspect before replacing."
            exit 1
          fi
          git rm -r --quiet games/street-empire
          mv street-empire-export games/street-empire
          printf '%s\n' '5abad23bf4fdc51a2c5c079522c5f7da09806579' > games/street-empire/.source-sha
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A games/street-empire
          git commit -m 'Publish focused Street Empire audio cleanup'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main moved during publish; retrying ($attempt/5)."
            sleep "$((attempt * 2))"
          done
          echo "::error::Could not publish Street Empire after five main-branch retries."
          exit 1
