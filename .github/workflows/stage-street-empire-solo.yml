name: Stage Street Empire online web
# publish-trigger: first-person-cameras-20261025
# publish-trigger: verified-quick-hustle-20261012
# publish-trigger: phase-1h-retry
# publish-trigger: phase-1g-secured
# publish-trigger: silly-codes
# publish-trigger: soundtrack-web-fix
# publish-trigger: phase-1g-retry
# publish-trigger: phase-1f-retry

on:
  pull_request:
    paths:
      - '.github/workflows/stage-street-empire-solo.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-street-empire-solo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-street-empire-solo
  cancel-in-progress: false

jobs:
  verify-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Require private source access
        env:
          SOURCE_TOKEN: ${{ secrets.STREET_EMPIRE_READ_TOKEN }}
        run: |
          if test -z "$SOURCE_TOKEN"; then
            echo "::error::Add a fine-grained read-only token for hyphsworld/STREET-EMPIRE as STREET_EMPIRE_READ_TOKEN in this repository."
            exit 1
          fi
      - name: Verify token can read the private repository
        env:
          SOURCE_TOKEN: ${{ secrets.STREET_EMPIRE_READ_TOKEN }}
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $SOURCE_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/hyphsworld/STREET-EMPIRE)"
          if test "$status" != 200; then
            echo "::error::STREET_EMPIRE_READ_TOKEN cannot read hyphsworld/STREET-EMPIRE (GitHub API HTTP $status). Check the token's repository selection, Contents: Read permission, and approval/expiration."
            exit 1
          fi
      - name: Checkout pinned Street Empire source
        uses: actions/checkout@v4
        with:
          repository: hyphsworld/STREET-EMPIRE
          ref: 2e2a966bb6e5f0b2bd26d35cb406a6e70131d80a
          token: ${{ secrets.STREET_EMPIRE_READ_TOKEN }}
          path: game
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check board data
        run: python3 game/scripts/export_game_config.py --check
      - name: Install dependencies and typecheck
        working-directory: game/frontend
        run: |
          corepack enable
          yarn install --non-interactive
          yarn tsc --noEmit
          node scripts/check-winnings-viewer.js
          node scripts/check-solo-upgrade.js
          node scripts/check-solo-persistence.js
          node scripts/check-game-lifecycle.js
          node scripts/check-pause-pacing.js
          node scripts/check-audio-races.js
          node scripts/check-web-audio.js
          node scripts/check-effect-readiness.js
          node scripts/check-roll-cues.js
          node scripts/check-game-cues.js
          node scripts/check-street-activities.js
          node scripts/check-first-night.js
          node scripts/check-quick-hustle.js
          node scripts/check-operation-security.js
          node scripts/check-block-narrator.js
          node scripts/check-block-narrator-integration.js
          node scripts/check-block-narrator-runtime.js
          node scripts/check-corner-edition.js
          node scripts/check-garage-setbacks.js
          node scripts/check-player-customization.js
          node scripts/check-social-session.js
          node scripts/check-friend-discovery.js
          python3 scripts/check-cue-levels.py
      - name: Check server reward boundary and concurrent settlement
        working-directory: game
        env:
          TEST_POSTGRES_URL: postgresql://postgres:fixture@localhost:5432/postgres
        run: |
          npm install --prefix /tmp/hustle-sql-test --no-save pg@8.16.3 @electric-sql/pglite@0.3.14
          NODE_PATH=/tmp/hustle-sql-test/node_modules node scripts/check_hustle_sql.js
      - name: Export web build
        working-directory: game/frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: ''
          CI: '1'
        run: yarn export:web
      - name: Add static deep links
        run: python3 game/scripts/prepare_pages_export.py
      - name: Require HYPHSWORLD ID on exported game routes
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          guard = '<script src="/member-access.js?v=20261005-members"></script>'
          for page in Path('game/frontend/dist').rglob('*.html'):
              html = page.read_text()
              html = re.sub(r'((?:auth-client|global-my-id|global-points-engine|points-core)\.js)(?:\?[^"<>\s]*)?(?=")', r'\1?v=20261005-member-menu', html)
              if 'src="/member-access.js' not in html:
                  html = html.replace('<head>', '<head>' + guard, 1)
              page.write_text(html)
          PYCODE
      - name: Verify routes and local assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('game/frontend/dist')
          for path in ('index.html', 'setup.html', 'game.html', 'online.html', 'login.html',
                       'online-game.html', 'setup/index.html', 'game/index.html',
                       'online/index.html', 'login/index.html', 'online-game/index.html'):
              assert (root / path).is_file(), path
          html_files = list(root.rglob('*.html'))
          assert html_files
          for page in html_files:
              text = page.read_text(encoding='utf-8')
              for ref in re.findall(r'(?:src|href)="([^"]+)"', text):
                  if ref.startswith('/games/street-empire/'):
                      asset = ref.removeprefix('/games/street-empire/')
                      assert (root / asset).is_file(), (page, ref)
          print(f'Checked {len(html_files)} HTML routes and local assets')
          PY
      - name: Check exported Quick Hustle phone controls and achievements
        working-directory: game
        run: |
          npm install --prefix /tmp/hustle-browser --no-save playwright@1.56.1
          /tmp/hustle-browser/node_modules/.bin/playwright install --with-deps chromium --only-shell
          NODE_PATH=/tmp/hustle-browser/node_modules node scripts/check_quick_hustle_browser.js
          NODE_PATH=/tmp/hustle-browser/node_modules node scripts/check_corner_browser.js
          NODE_PATH=/tmp/hustle-browser/node_modules node scripts/check_pov_browser.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quick-hustle-release-previews
          path: |
            /tmp/hustle-*.png
            /tmp/corner-*.png
            /tmp/pov-*.png
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: street-empire-online-site
          path: game/frontend/dist/
          if-no-files-found: error
          retention-days: 7

  publish-route:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: verify-export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout HYPHSWORLD main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: street-empire-online-site
          path: site/street-empire-export
      - name: Publish verified route update
        working-directory: site
        run: |
          test -s street-empire-export/index.html
          test -s games/street-empire/index.html
          previous_source="$(git show HEAD:games/street-empire/.source-sha)"
          # Re-running a successfully published build is a safe no-op.
          if test "$previous_source" = '2e2a966bb6e5f0b2bd26d35cb406a6e70131d80a'; then
            echo "Street Empire target source is already published. No update needed."
            exit 0
          fi
          if test "$previous_source" != '501eb98e6964063dbcfdd9b11e6b8d664c55bd74'; then
            echo "::error::Street Empire route changed since the reviewed export; inspect before replacing."
            exit 1
          fi
          # Overlay the tested export and keep existing files and sound assets.
          cp -a street-empire-export/. games/street-empire/
          printf '%s\n' '2e2a966bb6e5f0b2bd26d35cb406a6e70131d80a' > games/street-empire/.source-sha
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A games/street-empire
          if test -n "$(git diff --cached --diff-filter=D --name-only -- games/street-empire)"; then
            echo "::error::Publication must not delete existing Street Empire files."
            exit 1
          fi
          git commit -m 'Release Street Empire first-person delivery, jail and security cameras'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            latest_source="$(git show origin/main:games/street-empire/.source-sha)"
            # Another approved publication may have finished while this build ran.
            if test "$latest_source" = '2e2a966bb6e5f0b2bd26d35cb406a6e70131d80a'; then
              echo "Street Empire target source is already published on origin/main."
              exit 0
            fi
            if test "$latest_source" != '501eb98e6964063dbcfdd9b11e6b8d664c55bd74'; then
              echo "::error::Street Empire changed during publication; inspect before replacing."
              exit 1
            fi
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main moved during publish; retrying ($attempt/5)."
            sleep "$((attempt * 2))"
          done
          echo "::error::Could not publish Street Empire after five main-branch retries."
          exit 1

