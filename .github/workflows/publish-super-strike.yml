name: Preview Super Strike Audio

on:
  workflow_dispatch:
  push:
    branches:
      - preview/super-strike-audio
    paths:
      - '.github/workflows/publish-super-strike.yml'

permissions:
  contents: write

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HYPHSWORLD preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/super-strike-audio
          path: site

      - name: Checkout Super Strike audio preview
        uses: actions/checkout@v4
        with:
          repository: hyphsworld/SS-BOWLING
          ref: feature/pop-wall-alley-gator
          path: game

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Super Strike dependencies
        working-directory: game/frontend
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Export Super Strike web build
        working-directory: game/frontend
        run: npx expo export --platform web --output-dir dist

      - name: Rebase exported paths for preview subfolder
        working-directory: game/frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base = '/preview/super-strike-audio/'
          old_base = '/games/ss-bowling/'
          dist = Path('dist')
          text_exts = {'.html', '.js', '.css', '.json', '.map', '.txt', '.webmanifest'}
          replacements = [
              (old_base, base),
              ('"/_expo/', f'"{base}_expo/'),
              ("'/_expo/", f"'{base}_expo/"),
              ('"/assets/', f'"{base}assets/'),
              ("'/assets/", f"'{base}assets/"),
              ('url(/assets/', f'url({base}assets/'),
              ('href="/favicon.ico"', f'href="{base}favicon.ico"'),
          ]
          for p in dist.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in text_exts:
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = s
              for old, new in replacements:
                  s = s.replace(old, new)
              if s != original:
                  p.write_text(s, encoding='utf-8')
          PY

      - name: Replace preview route
        run: |
          rm -rf site/preview/super-strike-audio
          mkdir -p site/preview/super-strike-audio
          cp -R game/frontend/dist/. site/preview/super-strike-audio/

      - name: Verify preview route
        run: |
          test -f site/preview/super-strike-audio/index.html
          test -d site/preview/super-strike-audio/_expo
          grep -q '/preview/super-strike-audio/_expo/' site/preview/super-strike-audio/index.html

      - name: Commit preview build
        working-directory: site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/super-strike-audio
          if git diff --cached --quiet; then
            echo 'No preview changes to publish.'
            exit 0
          fi
          git commit -m 'Publish temporary Super Strike audio preview'
          git push origin HEAD:preview/super-strike-audio
