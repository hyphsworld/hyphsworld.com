<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MULA Sandbox Test | HYPHSWORLD</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif}body{background:#130f10;color:#fff;margin:0}main{max-width:650px;margin:8vh auto;padding:24px}h1{font-size:clamp(2.3rem,7vw,4rem);line-height:1}p{line-height:1.5;color:#ddd}article{border:1px solid #745632;background:#221b19;border-radius:18px;padding:24px}button{background:#eab868;color:#1a120a;border:0;border-radius:9px;padding:16px 25px;font-weight:800;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.tag{font-size:.8rem;letter-spacing:.12em;color:#e6b96f;font-weight:800}a{color:#e6b96f}</style></head><body><main><div class="tag">AMS WEST / PRIVATE SANDBOX TEST</div><h1>MULA</h1><article><p>Hyph Life ft. KILI 631 · Produced by Cuz Zaid of The Ozakis</p><h2>$1.99 · TEST PAYMENT ONLY</h2><p>This checkout uses Stripe's sandbox, requires the approved Hyph Life owner's HYPHSWORLD login, and is not a public sale.</p><button id="purchase" disabled>Preparing account check…</button><p id="status" role="status">Checking your login…</p><button id="download" disabled>CHECK PURCHASE / DOWNLOAD WAV</button><p id="download-status" role="status"></p><p><a href="music-library.html">My Music Library</a></p></article></main>
<script src="supabase-config.js"></script><script src="auth-client.js"></script><script>
(async function(){
 'use strict';
 const btn=document.getElementById('purchase'),status=document.getElementById('status'),download=document.getElementById('download'),downloadStatus=document.getElementById('download-status');
 function update(s){status.textContent=s}
 try{
  if(!window.HWAuth)throw Error('Sign-in client unavailable');
  const user=await window.HWAuth.getCurrentUser();
  if(!user?.userId){update('Please sign in to your HYPHSWORLD account first.');return}
  const client=await window.HWAuth.getClient();
  const {data:{session}}=await client.auth.getSession();
  if(!session){update('A verified Supabase login is required.');return}
  const config=window.HW_SUPABASE_CONFIG;
  if(!config?.url||!config?.anonKey)throw Error('Checkout configuration unavailable');
  btn.disabled=false;btn.textContent='OPEN $1.99 SANDBOX CHECKOUT';download.disabled=false;update('Only the approved creator owner can proceed.');
  download.onclick=async()=>{
   download.disabled=true;
   downloadStatus.textContent='Checking your purchase license…';
   try {
     const {data:{session:activeSession}}=await client.auth.getSession();
     if(!activeSession)throw Error('Please sign in again');
     const {data:license,error:licenseError}=await client.from('music_licenses').select('id').eq('release_id','634c67a4-da23-422d-85e2-320b0471f831').eq('buyer_id',activeSession.user.id).eq('status','active').limit(1);
     if(licenseError||!license?.length)throw Error('No completed music purchase found yet. Wait for payment confirmation and try again.');
     const response=await fetch(config.url+'/functions/v1/music-download',{method:'POST',headers:{'Content-Type':'application/json',apikey:config.anonKey,Authorization:'Bearer '+activeSession.access_token},body:JSON.stringify({track_id:'c7197ac1-2dc1-4632-854e-1a6455c01852'})});
     const result=await response.json();
     if(!response.ok||!result.url)throw Error(result.error||'Download unavailable');
     const target=new URL(result.url);
     if(target.protocol!=='https:'||target.hostname!=='yuhxtdkhsltaqiagrtys.supabase.co')throw Error('Invalid download domain');
     downloadStatus.textContent='Purchase verified. Opening your protected WAV download.';
     window.location.assign(target.href);
   }catch(e){downloadStatus.textContent=String(e.message||e);}
   finally{download.disabled=false}
  };
  btn.onclick=async()=>{
   btn.disabled=true;btn.textContent='Opening secure checkout…';
   try{
    const refreshed=await client.auth.getSession();
    if(!refreshed.data.session)throw Error('Session expired; please sign in again');
    const response=await fetch(config.url+'/functions/v1/music-create-checkout',{method:'POST',headers:{'Content-Type':'application/json','apikey':config.anonKey,'Authorization':'Bearer '+refreshed.data.session.access_token},body:JSON.stringify({release_id:'634c67a4-da23-422d-85e2-320b0471f831'})});
    const data=await response.json();
    if(!response.ok)throw Error(data.error||'Checkout not available');
    const url=new URL(data.url);
    if(url.protocol!=='https:'||url.hostname!=='checkout.stripe.com')throw Error('Untrusted checkout destination');
    window.location.assign(url.href);
   }catch(e){update('Checkout unavailable: '+String(e.message||e));btn.disabled=false;btn.textContent='OPEN $1.99 SANDBOX CHECKOUT'}
  };
  if(new URLSearchParams(location.search).get('checkout')==='success')update('Stripe checkout returned. Check My Music Library for payment confirmation; it can take a moment for the webhook to process.');
 }catch(e){update(String(e.message||e));btn.disabled=true}
})();
</script></body></html>
