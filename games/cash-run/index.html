  <div id="root"></div>
  <script>
    (function(){
      var root=document.getElementById('root');
      if(!root)return;
      var boundStick=null;
      var lastPulse=0;
      function bindStick(){
        var stick=document.querySelector('[data-testid="touch-joystick"]');
        if(!stick||stick===boundStick)return;
        boundStick=stick;
        var activate=function(){stick.classList.add('hw-stick-active');var now=Date.now();if(now-lastPulse>90&&navigator.vibrate){try{navigator.vibrate(8)}catch(e){}lastPulse=now;}};
        var release=function(){stick.classList.remove('hw-stick-active')};
        stick.addEventListener('pointerdown',activate,{passive:true});
        stick.addEventListener('pointerup',release,{passive:true});
        stick.addEventListener('pointercancel',release,{passive:true});
        stick.addEventListener('lostpointercapture',release,{passive:true});
      }
      function syncGameState(){
        bindStick();
        var text=(root.textContent||'').toUpperCase();
        var gameOver=text.indexOf('GAME OVER')!==-1||text.indexOf('SUBMIT SCORE')!==-1;
        document.documentElement.classList.toggle('hw-game-over',gameOver);
      }
      new MutationObserver(syncGameState).observe(root,{subtree:true,childList:true,characterData:true});
      window.addEventListener('orientationchange',syncGameState,{passive:true});
      window.addEventListener('resize',syncGameState,{passive:true});
      syncGameState();
    })();
  </script>
