<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HYPHSWORLD | Login</title>
  <link rel="stylesheet" href="auth.css" />
  <script src="site-analytics.js" defer></script>
  <style>
    :root{--green:#39ff7a;--cyan:#1ffcff;--ink:#050705;--muted:rgba(255,255,255,.72)}
    *{box-sizing:border-box}
    body{margin:0;background:#020604;color:#fff;overflow-x:hidden}
    .auth-shell{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative}
    .auth-shell:before{content:"";position:fixed;inset:-30%;z-index:-2;background:radial-gradient(circle at 20% 0%,rgba(57,255,122,.18),transparent 28%),radial-gradient(circle at 80% 10%,rgba(31,252,255,.15),transparent 28%),linear-gradient(145deg,#020604,#07120d 50%,#030504)}
    .simple-login{width:min(100%,430px);padding:30px 24px;border:1px solid rgba(57,255,122,.28);border-radius:26px;background:rgba(5,10,8,.86);box-shadow:0 24px 80px rgba(0,0,0,.48),0 0 36px rgba(57,255,122,.08);backdrop-filter:blur(14px)}
    .brand{text-align:center;margin-bottom:22px}
    .brand-mark{width:62px;height:62px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--green),var(--cyan));color:#020604;font-weight:1000;font-size:1.35rem;box-shadow:0 0 24px rgba(57,255,122,.28)}
    .brand h1{margin:0;font-size:clamp(1.8rem,7vw,2.45rem);letter-spacing:.04em;text-transform:uppercase}
    .brand p{margin:8px 0 0;color:var(--muted);font-weight:800;font-size:.92rem}
    #oneAuthForm{display:grid;gap:16px}
    label{display:grid;gap:7px;font-size:.9rem;font-weight:900}
    input{width:100%;min-height:54px;border-radius:15px;border:1px solid rgba(255,255,255,.16);background:#0a100d;color:#fff;padding:0 15px;font:inherit;outline:none}
    input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(57,255,122,.12)}
    .secret-code-wrap{position:relative}.secret-code-wrap input{padding-right:72px}.show-code{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--cyan);font:inherit;font-size:.78rem;font-weight:1000;cursor:pointer}
    .login-btn{min-height:56px;border:0;border-radius:15px;background:linear-gradient(90deg,var(--green),var(--cyan));color:#020604;font-weight:1000;font-size:1rem;text-transform:uppercase;letter-spacing:.08em;cursor:pointer}
    .login-btn:disabled{opacity:.58;cursor:wait}
    .message{min-height:0;margin:0 0 14px;padding:0;text-align:center;font-size:.9rem;font-weight:900}
    .message:not(:empty){padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.07)}
    .message.error{color:#ff8fab}.message.success{color:#8dffbd}.message.warn{color:#ffe889}
    .small-actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:18px;font-size:.84rem;font-weight:900}
    .small-actions a,.small-actions button{background:none;border:0;padding:0;color:rgba(255,255,255,.72);text-decoration:none;font:inherit;cursor:pointer}
    .small-actions a:hover,.small-actions button:hover{color:#fff}
    @media(max-width:520px){.auth-shell{padding:16px}.simple-login{padding:26px 18px;border-radius:22px}}
  </style>
</head>
<body>
  <main class="auth-shell">
    <section class="simple-login" id="authCard">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">HW</div>
        <h1>HYPHSWORLD</h1>
        <p>Enter your ID.</p>
      </div>

      <div id="message" class="message" role="status" aria-live="polite"></div>

      <form id="oneAuthForm" autocomplete="on">
        <label>Email
          <input id="authEmail" type="email" autocomplete="email" placeholder="you@email.com" required />
        </label>

        <label>Secret Code
          <span class="secret-code-wrap">
            <input id="authPassword" type="password" autocomplete="current-password" placeholder="Enter secret code" required />
            <button id="showCodeBtn" class="show-code" type="button" aria-controls="authPassword" aria-pressed="false">SHOW</button>
          </span>
        </label>

        <button id="oneAuthSubmit" class="login-btn" type="submit">Enter HYPHSWORLD</button>
      </form>

      <div class="small-actions">
        <button id="createIdBtn" type="button">Create ID</button>
        <a href="forgot-password.html">Forgot Secret Code?</a>
        <a href="index.html">Home</a>
      </div>
    </section>
  </main>

  <script src="supabase-config.js"></script>
  <script src="auth-client.js"></script>
  <script src="auth-stability.js"></script>
  <script src="auth-points-bridge.js"></script>
  <script src="cool-points.js"></script>
  <script src="global-points-engine.js"></script>
  <script src="cool-badges.js"></script>
  <script src="auth.js"></script>
</body>
</html>
